services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warren
    ports:
      - "5432:5432"
    volumes:
      # Run in alphabetical order on the first start of an empty volume.
      - ./db/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./db/migrations/001_constraints_indexes.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warren"]
      interval: 3s
      timeout: 3s
      retries: 20
